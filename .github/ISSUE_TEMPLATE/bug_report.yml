name: 缺陷报告
description: 报告可以稳定复现的软件问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 安全漏洞请不要在这里公开，改用仓库的 Security Advisory 私下报告。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 请说明实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复的步骤；不要上传客户文件、账号或密钥。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 例如 v0.1.0 或提交 SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python/Node/Docker 版本，以及是否使用 GPU/OCR。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell

