events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # pdf.js ESM worker 以及其它 .mjs 必须是 JS MIME，否则 module Worker / import() 会被拒
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 与 backend/app/api/routers/files.py 的 _MAX_UPLOAD_SIZE_MB 保持一致
    client_max_body_size 200M;

    # IP 直接访问 / 未配置域名时的 HTTP 回退（域名就绪后可删除此 block）
    server {
        listen 80 default_server;
        server_name _;

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            proxy_intercept_errors on;
            error_page 502 503 504 = @maintenance_api;
        }

        location @maintenance_api {
            default_type application/json;
            return 503 '{"code": 503, "message": "系统正在升级维护中，请稍后重试", "data": null}';
        }

        location /ws {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /health {
            proxy_pass http://backend:8000/health;
        }
    }

    # HTTP -> HTTPS 自动跳转（仅匹配域名）
    server {
        listen 80;
        server_name bidmind-ai.com www.bidmind-ai.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主服务
    server {
        listen 443 ssl;
        server_name bidmind-ai.com www.bidmind-ai.com;

        # SSL 证书
        ssl_certificate /etc/nginx/ssl/bidmind-ai.com.pem;
        ssl_certificate_key /etc/nginx/ssl/bidmind-ai.com.key;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 前端静态文件
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API代理
        location /api {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            proxy_intercept_errors on;
            error_page 502 503 504 = @maintenance_api_ssl;
        }

        location @maintenance_api_ssl {
            default_type application/json;
            return 503 '{"code": 503, "message": "系统正在升级维护中，请稍后重试", "data": null}';
        }

        # WebSocket代理
        location /ws {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # 健康检查
        location /health {
            proxy_pass http://backend:8000/health;
        }
    }
}