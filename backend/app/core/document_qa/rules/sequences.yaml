# 有序标识序列家族(编号连续性检查)
# 机制: 行首锚定正则捕获编号, 家族内按父前缀分组做序列差分(缺号/重号/倒序)
# 新增家族只加配置, 不改判定链(泛化护栏: 图/表/附件/附录是夹具, 不是专用路径)
# DOC-NUM-002: 同号页距 > duplicate_max_page_gap 视为另一编号实例, 不捕获
# 印刷页码是整本唯一序列, 不走此阈值
duplicate_max_page_gap: 2
families:
  - key: figure
    label: "图"
    patterns:
      - "^图\\s*([0-9]{1,3}(?:[-－–.][0-9]{1,3})?)(?:\\s*[:：]|\\s+|(?=[\\u4e00-\\u9fff]|$))"
  - key: table
    label: "表"
    patterns:
      - "^表\\s*([0-9]{1,3}(?:[-－–.][0-9]{1,3})?)(?:\\s*[:：]|\\s+|(?=[\\u4e00-\\u9fff]|$))"
  - key: attachment
    label: "附件"
    patterns:
      - "^附件\\s*([0-9]{1,2}|[一二三四五六七八九十]{1,3})\\s*[:：\\s]"
  - key: appendix
    label: "附录"
    patterns:
      - "^附录\\s*([0-9]{1,2}|[A-Z]|[一二三四五六七八九十]{1,3})\\s*[:：\\s]"
