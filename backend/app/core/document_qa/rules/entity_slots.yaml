# 实体槽位台账(一致性检查)
# 机制: 槽位定义 + 类型化归一化器 + 同槽位多值冲突聚类
# 新增实体(如质保期/联系人)只加槽位配置与归一化器类型, 禁止新建专用检查器
# 正则契约: 捕获组1=取值, 可选捕获组2=单位
slots:
  - key: project_name
    label: "项目名称"
    kind: text
    severity: P0
    patterns:
      - "项目名称[:：]\\s*([^\\s，,。;；:：]{4,50})"
  - key: project_no
    label: "项目编号"
    kind: identifier
    severity: P0
    patterns:
      # 冒号可选: 真实文本存在"编号␣值"空格句式(金标3638 P22); 取值字符类不含中文, 无冒号不会误吞正文
      - "(?:项目|招标|采购)编号\\s*[:：]?\\s*([A-Za-z0-9\\-－—–_/#()]{4,40})"
  - key: bidder_name
    label: "投标人名称"
    kind: org_name
    severity: P0
    patterns:
      - "投标人(?:名称)?\\s*[（(]?(?:全称|盖章|公章)?[)）]?\\s*[:：]\\s*([^\\s，,。;；:：（()）]{4,40})"
  - key: bid_price
    label: "投标报价"
    kind: money
    severity: P0
    patterns:
      - "投标(?:总价|报价|总报价)\\s*[（(]?(?:小写)?[)）]?\\s*[:：]?\\s*(?:人民币)?\\s*[¥￥]?\\s*([0-9][0-9,，]{0,15}(?:\\.[0-9]{1,2})?)\\s*(万元|元)"
  - key: duration
    label: "工期/周期"
    kind: duration
    severity: P1
    patterns:
      # 同义触发词覆盖工程与科研口径(工期/服务期/研究周期/实施周期等)
      - "(?:总工期|工期|服务期限|服务期|交货期|(?:研究|实施|建设|项目|总体实施)周期)[:：]?\\s*(?:为)?\\s*([0-9]{1,4})\\s*(个?日历天|天|日|个月|个工作日|工作日)"
      # 计划口径变体: "暂按N个月完成"("暂按"为强信号词, 表示计划基准)
      - "暂按\\s*([0-9]{1,4})\\s*(个月|个?日历天|天|日)"
  - key: bid_validity
    label: "投标有效期"
    kind: duration
    severity: P1
    patterns:
      - "投标有效期[:：]?\\s*(?:为)?\\s*([0-9]{1,3})\\s*(个?日历天|天|日)"
  - key: budget_amount
    label: "项目预算/经费"
    kind: money
    severity: P0
    patterns:
      # 预算/经费类金额(触发词与数值间允许短间隔, 覆盖"经费测算表汇总金额为N万元"句式)
      - "(?:项目)?(?:预算|经费)[^。；，,\\n]{0,8}?(?:为)?\\s*[:：]?\\s*(?:人民币)?\\s*[¥￥]?\\s*([0-9][0-9,，]{0,15}(?:\\.[0-9]{1,2})?)\\s*(万元|元)"
  - key: milestone_acceptance
    label: "阶段验收时间"
    kind: date
    severity: P1
    patterns:
      # 同一验收里程碑的多处日期(触发词与日期间允许短间隔, 覆盖""节点标注为"等变体)
      - "阶段验收[^。；，,\\n]{0,12}?([0-9]{4}年[0-9]{1,2}月[0-9]{1,2}日)"
  - key: measured_rate
    label: "数量口径"
    kind: quantity
    severity: P1
    conflict_scope: paragraph
    patterns:
      # 同一段里单位口径不同才冲突; 同单位不同数值不冲突(由归一化只保留单位)
      - "([0-9]+(?:\\.[0-9]+)?)\\s*(m3/d|m³/d|m3/月|m³/月|L/h|L/min)"

# 两个完整大纲标题只差连续少量字才算写法不一致; 正文或单元格词干不算
title_variant:
  min_chars: 8
  max_cut: 4

# 组织名等价: 装饰剥离 + 法律后缀锚点截断/折叠(换实体仍走同一归一化器)
org_name:
  decorations:
    - "公章"
    - "盖章"
    - "盖单位章"
    - "签字或盖私章"
    - "签名或盖私章"
    - "签字或盖章"
  legal_suffixes:
    - "股份有限公司"
    - "有限责任公司"
    - "集团有限公司"
    - "有限公司"
    - "集团公司"
    - "研究院"
    - "集团"
    - "公司"
