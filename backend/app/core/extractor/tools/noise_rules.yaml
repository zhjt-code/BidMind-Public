# 噪音规则库（评审意义降级护栏）
#
# 用途: 作为 LLM "评审意义分级"(review_relevance) 的规则兜底护栏。
#       命中即把该条要求纠偏为 procedural / informational（确认页默认折叠、不进审查打分）。
# 结构:
#   global       —— 适用所有类别的通用噪音（程序/纪律/告知）。
#   by_category  —— 仅对应类别命中的噪音（如 FORMAT 的物理形态/递交）。
# 安全:
#   1. 否决项(is_mandatory)不单凭本规则降级：无 LLM 翼的 relevance_resolver 强制豁免；
#      relevance_classifier 需「LLM 判非投标文件载体 + 本规则/行为词表/合同启发式任一命中
# + 无内容性例外」双确认才折叠为风险告知。
#   2. 仅"降级"(actionable -> procedural/informational)，绝不升级。
#   3. 折叠项可在确认页一键"升为审查项"，故规则可适度宽松。
#   4. 关键词需高特异性，禁止误伤实质响应项（报价/资质/业绩/技术参数/人员证书等）。

global:
  # 程序/递交/履约过程 + 禁止性告知（招标人规则，非投标人需逐条响应项）
  procedural:
    # 投标人纪律 / 串通投标禁止性告知
    - 串通投标
    - 相互串通
    - 围标
    - 陪标
    - 恶意竞标
    - 扰乱招投标
    - 投标团伙
    - 扫黑除恶
    - 投标人纪律
    - 弄虚作假骗取中标
    - 行贿谋取中标
    # 防串标技术性禁令（机器码 / IP / 硬件序列号）
    - 机器码
    - MAC地址
    - 网卡
    - 硬盘和主板的序列号
    - IP地址下载
    - 同一个自然人的IP
    # 异议 / 质疑 / 投诉 / 联系方式（程序性告知）
    - 异议提出渠道
    - 提出异议
    - 质疑与投诉
    - 投诉渠道
    - 招标代理机构
    - 联系电话
# 现场踏勘 / 查勘 / 答疑会 / 预备会（程序安排与风险告知, 样例）
    - 踏勘现场
    - 现场踏勘
    - 不组织踏勘
    - 现场查勘
    - 查勘要求
    - 提交投标文件视为已对施工现场
    - 答疑会
    - 投标预备会
# 资格审查程序（评委/招标人动作, 非投标文件内容, 样例）
    - 资格后审
    - 资格审查方式
    - 由评标委员会进行审核
    - 主体信息库
    - 信息库中调取
    # 开标 / 评标 / 定标程序（招标人流程，非投标响应项）
    - 开标时间
    - 开标地点
    - 开标流程
    - 评标委员会
    - 评标办法说明
    - 定标程序
    - 澄清或补正
    - 澄清与说明
    - 中标候选人公示
    - 中标通知书
    - 中标公示
    # 履约阶段程序（合同执行期，非投标阶段响应项）
    - 履约保证金退还
    - 合同签订时限
    - 合同签订地点
# 履约期管理告知（中标后请示/报批, 非投标阶段响应项, 样例）
    - 分包前须提前请示
    - 提前请示建设单位
    - 误期赔偿
    # 评标/定标方式与推荐（招标人流程说明，非投标响应项）
    - 中标候选人推荐
    - 推荐准则
    - 综合评分法
    - 递交时间延长
    - 延长投标文件递交时间
  # 政策性 / 背景告知（不构成可对标的投标响应项）
  informational:
    - 面向中小企业
    - 中小企业采购
    - 专门面向中小企业
    - 监狱企业
    - 残疾人福利性单位
    - 项目概况
    - 项目背景
    - 采购人名称
    - 招标方式
    - 招标人名称
    - 资金来源
    - 资金已落实
    - 资金落实
    - 注册地址信息
    # 合同/履约告知（中标后约定，非投标响应项）
    - 合同组成
    - 停待损失
    - 损失由乙方承担

# 按类别细分的噪音规则（仅对应 category 命中）
by_category:
  # 格式要求：物理形态 / 排版 / 递交方式（电子投标下多为程序性，非内容评审项）
  FORMAT:
    procedural:
      - 装订
      - 胶装
      - 骑缝章
      - 份数
      - 正本
      - 副本
      - 封套
      - 密封袋
      - 密封包装
      - 硬质封面
      - 纸张规格
      - 光盘
      - U盘
      - 优盘
      - 页码编排
      # 排版/字体（版面要求，非内容评审项）
      - 字体
      - 字号
      - 行距
      - 黑体
      - 宋体
      - 楷体
      - 页边距
      - 排版
      # 电子文件递交方式
      - PDF格式
      - 电子版投标文件
      - 病毒
      # 评审表填写说明（评委操作，非投标人响应）
      - 结论栏填写
      - 结论填写要求
    informational:
      # 无实质约束的格式自定项
      - 格式自定
      - 格式自拟
      - 格式由投标人自拟
      - 格式由投标人自定
      - 由投标人自行补充
  # 资质要求：资格审查程序 / 原件核验（程序性，非投标人材料本身）
  QUAL:
    procedural:
      - 原件核验
      - 资格审查由
      - 资格预审程序
  # 业绩要求：业绩核实程序（程序性，非业绩内容本身）
  PERF:
    procedural:
      - 业绩现场核实
      - 业绩真实性核查
  # 人员要求：到岗考勤等履约过程要求（非投标阶段响应项）
  STAFF:
    procedural:
      - 到岗考勤
      - 人员签到
